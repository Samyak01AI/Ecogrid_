services:
  - type: web
    name: ecogrid-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecogrid-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_HTTPS
        value: "true"
      - key: WEB_ORIGIN
        value: "*"
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: ecogrid-db
    databaseName: ecogrid
    user: ecogrid
    plan: free
